name: traffic

on:
  schedule:
    - cron: '23 2 * * *'   # daily UTC 02:23 (≈ Beijing 10:23), off the hour
  workflow_dispatch:        # manual catch-up runs

permissions:
  contents: write           # 把数据提交推到 chore/traffic-data 分支
  pull-requests: write      # 数据分支 → main 走 PR + auto-merge

env:
  DATA_BRANCH: chore/traffic-data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: python scripts/update_traffic.py
        env:
          GH_TOKEN: ${{ secrets.FLEET_TRAFFIC_PAT }}

      # main 已锁死（PR 必过 + required check `validate` + strict + 只允许 squash）：
      # 直接 git push main 会被 GH006 拒绝，所以改成「数据提交推到固定分支 → 复用同一个 PR → auto-merge」。
      # 每次都用最新 main 重新起分支并 force-push，PR 因此始终是最新的（strict 模式下才能自动合并）。
      - name: Commit stats via PR
        env:
          GH_TOKEN: ${{ secrets.FLEET_TRAFFIC_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain -- traffic/)" ]; then
            echo "traffic/ 没有变化，本次跳过。"
            exit 0
          fi

          git switch -c "$DATA_BRANCH"
          git add traffic/
          git commit -m "chore: update traffic stats"
          git push --force origin "$DATA_BRANCH"

          PR_TITLE="chore: update traffic stats"
          PR_BODY="每日自动刷新流量统计（\`scripts/update_traffic.py\`）。\`traffic/badges/\` 下的 JSON 供各仓库 README 的 shields.io 徽章读取；main 已锁 PR，故数据经本分支 auto-merge 合入。"

          gh pr create --base main --head "$DATA_BRANCH" \
            --title "$PR_TITLE" --body "$PR_BODY" >/dev/null || true

          # --auto：等 required check 通过后自动 squash 合并；已开启过则忽略报错
          gh pr merge "$DATA_BRANCH" --squash --delete-branch --auto
